name: Publish JVM SDK (Maven Central)

# Deploys signed JARs to Maven Central via Sonatype Central Portal API.
# Cryptographically signed with GPG key pair.

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: publish-jvm-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Build & Deploy to Maven Central
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
        env:
          MAVEN_USERNAME: ${{ secrets.SONATYPE_TOKEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.SONATYPE_TOKEN_PASSWORD }}

      - name: Run tests
        run: mvn --batch-mode test

      - name: Import GPG Key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::error::GPG_PRIVATE_KEY is required for Maven Central."
            exit 1
          fi
          GPG_PASSPHRASE="$(printf '%s' "$GPG_PASSPHRASE" | tr -d '\r')"
          key_file="${RUNNER_TEMP}/signing-key.asc"
          if printf '%s' "$GPG_PRIVATE_KEY" | grep -q "BEGIN PGP"; then
            printf '%s\n' "$GPG_PRIVATE_KEY" > "$key_file"
          else
            printf '%s' "$GPG_PRIVATE_KEY" | base64 -d > "$key_file"
          fi
          if [ ! -s "$key_file" ]; then
            echo "::error::Failed to decode GPG_PRIVATE_KEY into an ASCII-armored PGP key."
            exit 1
          fi
          export GNUPGHOME="${RUNNER_TEMP}/gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          printf 'pinentry-mode loopback\n' > "$GNUPGHOME/gpg.conf"
          printf 'allow-loopback-pinentry\n' > "$GNUPGHOME/gpg-agent.conf"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          gpg --batch --import --no-tty --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" "$key_file"

      - name: Deploy to Maven Central
        env:
          MAVEN_USERNAME: ${{ secrets.SONATYPE_TOKEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.SONATYPE_TOKEN_PASSWORD }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          key_id="${GPG_KEY_ID#0x}"
          key_id="${key_id#0X}"
          mvn --batch-mode clean deploy -DskipTests -P release \
            -Dgpg.keyname="$key_id" \
            -Dgpg.passphrase="$GPG_PASSPHRASE"
